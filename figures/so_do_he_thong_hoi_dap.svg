<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="320" viewBox="0 0 1680 320" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ tổng thể hệ thống hỏi đáp bằng giọng nói tiếng Việt</title>
  <desc id="desc">Âm thanh câu hỏi đi qua mô hình tách giọng, mô hình tăng cường tiếng nói, mô hình nhận dạng tiếng nói, mô hình tạo câu trả lời và mô hình tổng hợp tiếng nói để tạo câu trả lời bằng âm thanh. Hai mô hình đầu là trọng tâm tinh chỉnh.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d5268"/>
    </marker>
    <style>
      text { font-family: 'Times New Roman', 'Liberation Serif', serif; fill: #17283a; }
      .heading { font-size: 23px; font-weight: bold; }
      .detail { font-size: 19px; }
      .note { font-size: 17px; }
      .link { fill: none; stroke: #3d5268; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1680" height="320" fill="#ffffff"/>

  <rect x="20" y="80" width="188" height="130" rx="12" fill="#f1f4f7" stroke="#74849a" stroke-width="2"/>
  <text x="114" y="132" text-anchor="middle" class="heading">Âm thanh</text>
  <text x="114" y="162" text-anchor="middle" class="detail">câu hỏi</text>

  <path class="link" d="M 208 145 H 235"/>
  <rect x="245" y="80" width="210" height="130" rx="12" fill="#e6f4ed" stroke="#267351" stroke-width="3"/>
  <text x="350" y="127" text-anchor="middle" class="heading">Tách giọng nói</text>
  <text x="350" y="160" text-anchor="middle" class="detail">Chọn giọng chính</text>
  <text x="350" y="191" text-anchor="middle" class="note">Mô hình tinh chỉnh</text>

  <path class="link" d="M 455 145 H 482"/>
  <rect x="492" y="80" width="220" height="130" rx="12" fill="#e6f4ed" stroke="#267351" stroke-width="3"/>
  <text x="602" y="120" text-anchor="middle" class="heading">Tăng cường</text>
  <text x="602" y="150" text-anchor="middle" class="heading">tiếng nói</text>
  <text x="602" y="191" text-anchor="middle" class="note">Mô hình tinh chỉnh</text>

  <path class="link" d="M 712 145 H 739"/>
  <rect x="749" y="80" width="205" height="130" rx="12" fill="#e8f0fa" stroke="#456b9a" stroke-width="2"/>
  <text x="851.5" y="127" text-anchor="middle" class="heading">Nhận dạng</text>
  <text x="851.5" y="157" text-anchor="middle" class="heading">tiếng nói</text>
  <text x="851.5" y="190" text-anchor="middle" class="note">Văn bản câu hỏi</text>

  <path class="link" d="M 954 145 H 981"/>
  <rect x="991" y="80" width="205" height="130" rx="12" fill="#e8f0fa" stroke="#456b9a" stroke-width="2"/>
  <text x="1093.5" y="127" text-anchor="middle" class="heading">Tạo câu</text>
  <text x="1093.5" y="157" text-anchor="middle" class="heading">trả lời</text>
  <text x="1093.5" y="190" text-anchor="middle" class="note">Văn bản trả lời</text>

  <path class="link" d="M 1196 145 H 1223"/>
  <rect x="1233" y="80" width="205" height="130" rx="12" fill="#e8f0fa" stroke="#456b9a" stroke-width="2"/>
  <text x="1335.5" y="127" text-anchor="middle" class="heading">Tổng hợp</text>
  <text x="1335.5" y="157" text-anchor="middle" class="heading">tiếng nói</text>

  <path class="link" d="M 1438 145 H 1465"/>
  <rect x="1475" y="80" width="185" height="130" rx="12" fill="#f1f4f7" stroke="#74849a" stroke-width="2"/>
  <text x="1567.5" y="130" text-anchor="middle" class="heading">Âm thanh</text>
  <text x="1567.5" y="160" text-anchor="middle" class="detail">trả lời</text>

  <rect x="425" y="254" width="24" height="20" fill="#e6f4ed" stroke="#267351" stroke-width="2"/>
  <text x="461" y="271" class="note">Trọng tâm tinh chỉnh và đánh giá</text>
  <rect x="1000" y="254" width="24" height="20" fill="#e8f0fa" stroke="#456b9a" stroke-width="2"/>
  <text x="1036" y="271" class="note">Các công đoạn tích hợp</text>
</svg>
