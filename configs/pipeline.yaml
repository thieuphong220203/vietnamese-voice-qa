version: 1

# VAD và Enhancement vẫn dùng mock; Separation dùng SepFormer.
components:
  vad:
    name: mock
    params:
      emit_speech: true

  separation:
    # Cấu hình chi tiết: configs/separation.yaml. Đổi về `name: mock` nếu chưa cài speechbrain.
    name: sepformer
    params:
      model_id: speechbrain/sepformer-whamr16k
      checkpoint: checkpoints/separation/finetuned/best.pt   # fine-tune VIVOS; thiếu file thì dùng model gốc
      device: auto
      output: primary   # chỉ đưa giọng to nhất (người hỏi) sang ASR

  enhancement:
    name: dtln
    params:
      checkpoint: checkpoints/enhancement/dtln/dtln_finetuned_best.keras
      baseline_checkpoint: checkpoints/enhancement/DTLN/pretrained_model/model.h5
      source_dir: checkpoints/enhancement/DTLN
      sample_rate: 16000
      device: auto

  asr:
    name: phowhisper
    params:
      model_id: vinai/PhoWhisper-small
      device: auto
      dtype: auto

  qa:
    type: qwen
    model_id: Qwen/Qwen2.5-3B-Instruct
    device: auto
    max_new_tokens: 128
    system_prompt: >-
      Bạn là một trợ lý hội thoại bằng tiếng Việt.
      Hãy trả lời chính xác, rõ ràng và ngắn gọn.
      Không lặp lại câu hỏi của người dùng.

  tts:
    name: vieneu
    params:
      voice: Hải Đăng
      backend: onnx
      precision: fp32

pipeline:
  transcript_separator: " "
