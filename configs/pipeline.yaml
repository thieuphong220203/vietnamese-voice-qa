version: 1

# Phase 1 intentionally uses only deterministic local mock components.
components:
  vad:
    name: mock
    params:
      emit_speech: true

  separation:
    name: mock
    params:
      source_count: 1

  enhancement:
    name: dtln
    params:
      checkpoint: checkpoints/enhancement/dtln/DTLN_vi_snr5_lr1e-4_run01.weights.h5
      baseline_checkpoint: checkpoints/enhancement/DTLN/pretrained_model/model.h5
      source_dir: checkpoints/enhancement/DTLN
      sample_rate: 16000
      device: auto

  asr:
    name: phowhisper
    params:
      model_id: vinai/PhoWhisper-small
      device: auto
      dtype: auto

  qa:
    type: qwen
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    device: auto
    max_new_tokens: 128
    system_prompt: >-
      Bạn là một trợ lý hội thoại bằng tiếng Việt.
      Hãy trả lời chính xác, rõ ràng và ngắn gọn.
      Không lặp lại câu hỏi của người dùng.

  tts:
    name: vieneu
    params:
      voice: Hải Đăng
      backend: onnx
      precision: fp32

pipeline:
  transcript_separator: " "
