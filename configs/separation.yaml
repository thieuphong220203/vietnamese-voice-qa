name: sepformer

params:
  model_id: speechbrain/sepformer-whamr16k
  device: auto
  # Trọng số fine-tune trên tiếng Việt (VIVOS). Không có file thì tự dùng model gốc.
  checkpoint: checkpoints/separation/finetuned/best.pt
  output: primary   # primary = chỉ giữ giọng to nhất cho ASR; all = giữ mọi giọng
  normalize: true
